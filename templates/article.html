  <article class="pane focus" id="{{id}}" aria-label="{{kind}}/{{slug}}">
    <div class="bt"><span>┌─</span><span class="tt"><span>{{kind}}<span class="s">/{{slug}}</span></span></span><span class="ln"></span><span>┐</span></div>
    <div class="in">
      <header class="head">
        <h1>{{title}}</h1>
        <p class="sub">{{sub}}</p>
        <nav class="navrow" aria-label="nav">
          <span class="nv prev"><span class="k"><b>h</b> prev</span>{{prev}}</span>
          <span class="nv back"><span class="k"><b>q</b> back</span><a href="{{back}}">{{back_label}}</a></span>
          <span class="nv next"><span class="k"><b>l</b> next</span>{{next}}</span>
        </nav>
      </header>
      <div class="article">
{{body}}
      </div>
    </div>
    <div class="bb"><span>└</span><span class="ln"></span><span>┘</span></div>
  </article>
